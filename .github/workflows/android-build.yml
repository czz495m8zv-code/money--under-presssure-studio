name: Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    outputs:
      signing_configured: ${{ steps.signing.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Report signing configuration
        id: signing
        run: echo "configured=${HAS_ANDROID_SIGNING_SECRETS}" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build stable-signed release APK
        if: ${{ env.HAS_ANDROID_SIGNING_SECRETS == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f app/release.keystore' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/app/release.keystore"
          gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload signed release APK
        if: ${{ env.HAS_ANDROID_SIGNING_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: money-under-pressure-studio-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: money-under-pressure-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  smoke:
    needs: build
    if: ${{ needs.build.outputs.signing_configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: money-under-pressure-studio-release
          path: release

      - name: Install and launch signed APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          system-image-api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          cores: 2
          ram-size: 2048M
          script: |
            set -euo pipefail
            APK="$(find release -type f -name app-release.apk | head -n 1)"
            test -s "$APK"
            adb logcat -c
            adb install -r "$APK"
            adb shell monkey -p com.moneyunderpressure.studio 1
            PID=""
            for attempt in $(seq 1 30); do
              PID="$(adb shell pidof com.moneyunderpressure.studio | tr -d '\r' || true)"
              if [ -n "$PID" ]; then
                break
              fi
              sleep 2
            done
            test -n "$PID"
            ACTIVITY="$(adb shell dumpsys activity activities | grep com.moneyunderpressure.studio || true)"
            test -n "$ACTIVITY"
            FATAL="$(adb logcat -d -s AndroidRuntime:E)"
            if echo "$FATAL" | grep -q "FATAL EXCEPTION"; then
              echo "$FATAL"
              exit 1
            fi
            echo "Signed APK installed, app process started, and launcher activity appeared on Android API 31."
