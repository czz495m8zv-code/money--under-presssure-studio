name: Renderer API Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "renderer/**"
      - ".github/workflows/renderer-tests.yml"
  pull_request:
    paths:
      - "renderer/**"
      - ".github/workflows/renderer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renderer/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r renderer/requirements.txt httpx
      - name: Compile Python files
        run: python -m compileall -q renderer
      - name: Run API tests
        run: python -m unittest renderer.test_api -v
