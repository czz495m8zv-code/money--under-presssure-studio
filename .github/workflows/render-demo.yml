name: Render Demo Video

on:
  push:
    branches: [ "main" ]
    paths:
      - "renderer/**"
      - ".github/workflows/render-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renderer/requirements.txt
      - name: Install offline narration fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install renderer dependencies
        run: python -m pip install -r renderer/requirements.txt
      - name: Render sample video
        run: python renderer/render_video.py --project renderer/sample_project.json --output output/money-under-pressure-demo.mp4
      - name: Test offline narration, FFmpeg muxing and MP4 audio
        env:
          MUP_FORCE_OFFLINE_TTS: "1"
        run: |
          python renderer/render_video.py --project renderer/narration_test_project.json --output output/narration-integration-test.mp4
          test -s output/narration-integration-test.mp4
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          result = subprocess.run(
              [ffmpeg, "-i", "output/narration-integration-test.mp4", "-map", "0:a:0", "-f", "null", "-"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              raise SystemExit("MP4 audio stream validation failed: " + result.stderr[-2000:])
          print("MP4 contains a decodable narration audio stream.")
          PY
      - name: Upload MP4 test outputs
        uses: actions/upload-artifact@v4
        with:
          name: money-under-pressure-render-test-videos
          path: |
            output/money-under-pressure-demo.mp4
            output/narration-integration-test.mp4
