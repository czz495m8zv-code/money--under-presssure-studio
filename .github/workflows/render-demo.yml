name: Render Demo Video

on:
  push:
    branches: [ "main" ]
    paths:
      - "renderer/**"
      - ".github/workflows/render-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renderer/requirements.txt
      - name: Install offline narration fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install renderer dependencies
        run: python -m pip install -r renderer/requirements.txt
      - name: Render sample video
        run: python renderer/render_video.py --project renderer/sample_project.json --output output/money-under-pressure-demo.mp4
      - name: Test offline narration, FFmpeg muxing and MP4 audio
        env:
          MUP_FORCE_OFFLINE_TTS: "1"
        run: |
          timeout 180s python renderer/render_video.py --project renderer/narration_test_project.json --output output/narration-integration-test.mp4
          test -s output/narration-integration-test.mp4
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          result = subprocess.run(
              [ffmpeg, "-nostdin", "-v", "error", "-i", "output/narration-integration-test.mp4", "-map", "0:a:0", "-f", "null", "-"],
              capture_output=True, text=True, timeout=60
          )
          if result.returncode != 0:
              raise SystemExit("MP4 audio stream validation failed: " + result.stderr[-2000:])
          print("MP4 contains a decodable narration audio stream.")
          PY
      - name: Render a narrated vertical Short
        env:
          MUP_FORCE_OFFLINE_TTS: "1"
        run: |
          timeout 180s python renderer/render_video.py --project renderer/short_test_project.json --output output/short-integration-test.mp4
          test -s output/short-integration-test.mp4
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          path = "output/short-integration-test.mp4"
          result = subprocess.run(
              [ffmpeg, "-nostdin", "-hide_banner", "-v", "error", "-i", path,
               "-map", "0:v:0", "-map", "0:a:0", "-f", "null", "-"],
              capture_output=True, text=True, timeout=60
          )
          if result.returncode != 0:
              raise SystemExit("Short MP4 audio/video decode failed: " + result.stderr[-2000:])
          probe = subprocess.run(
              [ffmpeg, "-nostdin", "-hide_banner", "-i", path, "-f", "null", "-"],
              capture_output=True, text=True, timeout=30
          )
          if "720x1280" not in probe.stderr:
              raise SystemExit("Short output is not 720x1280 portrait video.")
          print("Vertical Short is 720x1280 with decodable narration audio.")
          PY
      - name: Render all four Shorts through the API and verify MP4s and download routes
        env:
          MUP_FORCE_OFFLINE_TTS: "1"
          STUDIO_API_TOKEN: "ci-four-shorts-token"
        run: timeout 480s python renderer/integration_test_four_shorts.py
      - name: Upload MP4 test outputs
        uses: actions/upload-artifact@v4
        with:
          name: money-under-pressure-render-test-videos
          path: |
            output/money-under-pressure-demo.mp4
            output/narration-integration-test.mp4
            output/short-integration-test.mp4
            output/four-shorts-integration/*.mp4
